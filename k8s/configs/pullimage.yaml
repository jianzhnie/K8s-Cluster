apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      nodeSelector:
        robin-label: "super-node"
      containers:
      - name: nginx
        image: quay.io/ascend/vllm-ascend:main-a3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
